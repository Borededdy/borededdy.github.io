{{- $src := .Get "src" | default (.Get 0) -}}
{{- $alt := .Get "alt" | default (.Get 1) | default "" -}}
{{- $caption := .Get "caption" | default $alt -}}
<figure class="gallery-item">
  <a href="{{ $src }}" class="gallery-link" data-caption="{{ $caption }}">
    <img src="{{ $src }}" alt="{{ $alt }}" loading="lazy">
  </a>
</figure>
